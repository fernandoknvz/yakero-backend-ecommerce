services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yakero_ecommerce}
      MYSQL_USER: ${MYSQL_USER:-yakero_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - yakero_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - yakero_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-yakero_user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-yakero_ecommerce}
      DEBUG: "false"
      TESTING: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yakero_internal

  api-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    restart: "no"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-yakero_user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-yakero_ecommerce}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yakero_internal

volumes:
  yakero_mysql_data:

networks:
  yakero_internal:
    driver: bridge
